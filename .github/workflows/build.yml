# Comprueba que el mod compila en cada push y pull request. No publica nada.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['*.md', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runners/compilers Dusklight itself is built with (MSVC, GCC, AppleClang).
          - { os: windows-latest,   platform: win-x64 }
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest,     platform: macos-arm64 }
          # Intel Mac: cross-compiled on the arm64 runner (the SDK rejects universal binaries).
          - { os: macos-latest,     platform: macos-x64, cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --target hiveshock_package

      - uses: actions/upload-artifact@v4
        with:
          name: hiveshock-${{ matrix.platform }}
          path: build/mods/hiveshock.dusk
          if-no-files-found: error
          retention-days: 14
