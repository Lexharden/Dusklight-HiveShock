# Publica un Release cuando se empuja un tag vX.Y.Z.
#
# Cada plataforma produce su propio archivo:  HiveShock-Dusklight-<version>-<plataforma>.dusk
# Los nombres siguen la convención que entiende hive-web (win / linux / macos + x64 / arm64),
# así que la web los clasifica sola. Para añadir una plataforma, descomenta su fila en la matriz
# (y de build.yml). El código del mod tiene que compilar en esa plataforma.
#
# El nombre del workflow DEBE ser "Release": notify-web.yml escucha su final para avisar a la web.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(jq -r .version mod.json)"
          if [ "$version" != "$declared" ]; then
            echo "::error::El tag ($GITHUB_REF_NAME) no coincide con la versión de mod.json ($declared)"
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene una sección '## $version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  build:
    needs: verify
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mantener igual que la matriz de build.yml.
          - { os: windows-latest,   platform: win-x64 }
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest,     platform: macos-arm64 }
          - { os: macos-latest,     platform: macos-x64, cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --target hiveshock_package

      - name: Name the package
        run: |
          out="HiveShock-Dusklight-${{ needs.verify.outputs.version }}-${{ matrix.platform }}.dusk"
          cp build/mods/hiveshock.dusk "$out"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dusk-*
          merge-multiple: true

      - name: Checksums and notes
        run: |
          (cd dist && sha256sum *.dusk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          bash scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "HiveShock for Dusklight ${GITHUB_REF_NAME}" \
            --notes-file notes.md $flags
